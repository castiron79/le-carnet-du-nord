name: Validate Le Carnet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:release
      - run: npm run build
      - run: npx vite build --config static/vite.config.ts
      - run: python -m py_compile home-assistant-addon/rootfs/app/server.py
