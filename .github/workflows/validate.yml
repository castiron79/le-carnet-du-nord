name: Validate Le Carnet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:release
      - run: npm run build
      - run: npx vite build --config static/vite.config.ts
      - run: python -m py_compile home-assistant-addon/rootfs/app/server.py
      - run: python -c "import zipfile; z=zipfile.ZipFile('skill-packages/create-le-carnet-recipe-v7.zip'); assert z.testzip() is None; assert len(z.namelist()) == 10"
      - run: node --test tests/illustration-manifest.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
